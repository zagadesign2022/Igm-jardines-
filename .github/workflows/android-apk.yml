name: Compilar APK IGM JARDINES

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - version-032-descomprimida
    paths:
      - ".github/workflows/android-apk.yml"
      - "version-032-descomprimida/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
        with:
          ref: version-032-descomprimida

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Localizar proyecto Android
        id: project
        run: |
          FILE=$(find version-032-descomprimida -name settings.gradle.kts -print -quit)
          if [ -z "$FILE" ]; then
            echo "No se encuentra settings.gradle.kts"
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Proyecto localizado en: $DIR"

      - name: Comprobar proyecto
        run: |
          if [ -f tools/preflight.py ]; then
            python tools/preflight.py
          elif [ -f "${{ steps.project.outputs.dir }}/tools/preflight.py" ]; then
            python "${{ steps.project.outputs.dir }}/tools/preflight.py"
          fi

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Ajustar compatibilidad Java y Kotlin
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          cat >> app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

      - name: Declarar APIs Material 3 experimentales
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("app/src/main/java/com/igmjardines/app/AssetsTravelScreens.kt"),
              Path("app/src/main/java/com/igmjardines/app/ExpenseScreens.kt"),
              Path("app/src/main/java/com/igmjardines/app/WorkOrdersScreen.kt"),
          ]
          annotation = "@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)\n"
          for path in files:
              if not path.is_file():
                  raise SystemExit(f"No se encuentra: {path}")
              content = path.read_text(encoding="utf-8")
              if not content.startswith("@file:OptIn("):
                  path.write_text(annotation + content, encoding="utf-8")
              print(f"Corregido: {path}")
          PY

      - name: Compilar APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: IGM-JARDINES-APK
          path: version-032-descomprimida/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
